<rect x="490.0" y="650.0" width="220" height="100" fill="#FFFFFF" stroke="#9B59B6" stroke-width="2" rx="8" ry="8"/>
<text x="600.0" y="672.0" text-anchor="middle" font-size="13" fill="#9B59B6" font-weight="bold" font-style="normal">5. Адаптация для</text>
<text x="600.0" y="692.0" text-anchor="middle" font-size="11" fill="#000000" font-weight="normal" font-style="normal">слабо охваченных:</text>
<text x="600.0" y="708.0" text-anchor="middle" font-size="11" fill="#000000" font-weight="normal" font-style="normal">«Лайт»-интерфейс,</text>
<text x="600.0" y="724.0" text-anchor="middle" font-size="11" fill="#000000" font-weight="normal" font-style="normal">доверенный клиент</text>
<line x1="501.00505063388334" y1="451.81980515339467" x2="340.84536469513034" y2="587.9378605318051" stroke="#888888" stroke-width="1.5"/>
<rect x="164.73088065418818" y="567.9898987322333" width="220" height="100" fill="#FFFFFF" stroke="#1ABC9C" stroke-width="2" rx="8" ry="8"/>
<text x="274.7308806541882" y="589.9898987322333" text-anchor="middle" font-size="13" fill="#1ABC9C" font-weight="bold" font-style="normal">6. Облачные технологии</text>
<text x="274.7308806541882" y="609.9898987322333" text-anchor="middle" font-size="11" fill="#000000" font-weight="normal" font-style="normal">и микросервисы:</text>
<text x="274.7308806541882" y="625.9898987322333" text-anchor="middle" font-size="11" fill="#000000" font-weight="normal" font-style="normal">Kubernetes, ЦОДы,</text>
<text x="274.7308806541882" y="641.9898987322333" text-anchor="middle" font-size="11" fill="#000000" font-weight="normal" font-style="normal">Chaos Engineering</text>
<line x1="460.0" y1="420.0" x2="233.5" y2="420.00000000000006" stroke="#888888" stroke-width="1.5"/>
<rect x="30.0" y="370.00000000000006" width="220" height="100" fill="#FFFFFF" stroke="#34495E" stroke-width="2" rx="8" ry="8"/>
<text x="140.0" y="392.00000000000006" text-anchor="middle" font-size="13" fill="#34495E" font-weight="bold" font-style="normal">7. Цифровой рубль:</text>
<text x="140.0" y="412.00000000000006" text-anchor="middle" font-size="11" fill="#000000" font-weight="normal" font-style="normal">смарт-контракты,</text>
<text x="140.0" y="428.00000000000006" text-anchor="middle" font-size="11" fill="#000000" font-weight="normal" font-style="normal">целевые выплаты,</text>
<text x="140.0" y="444.00000000000006" text-anchor="middle" font-size="11" fill="#000000" font-weight="normal" font-style="normal">B2B-сервисы</text>
<line x1="501.00505063388334" y1="388.1801948466054" x2="340.8453646951303" y2="252.06213946819497" stroke="#888888" stroke-width="1.5"/>
<rect x="164.73088065418807" y="172.01010126776671" width="220" height="100" fill="#FFFFFF" stroke="#E67E22" stroke-width="2" rx="8" ry="8"/>
<text x="274.73088065418807" y="194.01010126776671" text-anchor="middle" font-size="13" fill="#E67E22" font-weight="bold" font-style="normal">8. Финансовая</text>
<text x="274.73088065418807" y="214.01010126776671" text-anchor="middle" font-size="11" fill="#000000" font-weight="normal" font-style="normal">грамотность:</text>
<text x="274.73088065418807" y="230.01010126776671" text-anchor="middle" font-size="11" fill="#000000" font-weight="normal" font-style="normal">обучение, NPS,</text>
<text x="274.73088065418807" y="246.01010126776671" text-anchor="middle" font-size="11" fill="#000000" font-weight="normal" font-style="normal">снижение рисков</text>
