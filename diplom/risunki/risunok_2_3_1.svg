<rect x="950.0" y="370.0" width="220" height="100" fill="#FFFFFF" stroke="#F4A300" stroke-width="2" rx="8" ry="8"/>
<text x="1060.0" y="392.0" text-anchor="middle" font-size="13" fill="#F4A300" font-weight="bold" font-style="normal">3. Альтернативные</text>
<text x="1060.0" y="412.0" text-anchor="middle" font-size="11" fill="#000000" font-weight="normal" font-style="normal">трансграничные:</text>
<text x="1060.0" y="428.0" text-anchor="middle" font-size="11" fill="#000000" font-weight="normal" font-style="normal">СПФС, CIPS, БРИКС,</text>
