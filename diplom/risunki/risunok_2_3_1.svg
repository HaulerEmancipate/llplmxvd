<text x="925.2691193458119" y="589.9898987322333" text-anchor="middle" font-size="13" fill="#E74C3C" font-weight="bold" font-style="normal">4. Усиление</text>
<text x="925.2691193458119" y="609.9898987322333" text-anchor="middle" font-size="11" fill="#000000" font-weight="normal" font-style="normal">безопасности:</text>
<text x="925.2691193458119" y="625.9898987322333" text-anchor="middle" font-size="11" fill="#000000" font-weight="normal" font-style="normal">поведенч. биометрия,</text>
<text x="925.2691193458119" y="641.9898987322333" text-anchor="middle" font-size="11" fill="#000000" font-weight="normal" font-style="normal">голосовой антифрод</text>
