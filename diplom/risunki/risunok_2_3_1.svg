<text x="600.0" y="30" text-anchor="middle" font-size="15" fill="#000000" font-weight="bold" font-style="normal">Рисунок 2.3.1 – Дерево направлений совершенствования системы переводов ПАО «Сбербанк»</text>
<rect x="460.0" y="375.0" width="280" height="90" fill="#FFF3CD" stroke="#000000" stroke-width="2" rx="4" ry="4"/>
<text x="600.0" y="408.5" text-anchor="middle" font-size="14" fill="#000000" font-weight="bold" font-style="normal">СОВЕРШЕНСТВОВАНИЕ</text>
<text x="600.0" y="425.5" text-anchor="middle" font-size="14" fill="#000000" font-weight="bold" font-style="normal">СИСТЕМЫ ПЕРЕВОДОВ</text>
<text x="600.0" y="442.5" text-anchor="middle" font-size="14" fill="#000000" font-weight="bold" font-style="normal">ПАО «СБЕРБАНК»</text>
<line x1="600.0" y1="375.0" x2="600.0" y2="182.5" stroke="#888888" stroke-width="1.5"/>
<rect x="490.0" y="90.0" width="220" height="100" fill="#FFFFFF" stroke="#21A038" stroke-width="2" rx="8" ry="8"/>
<text x="600.0" y="112.0" text-anchor="middle" font-size="13" fill="#21A038" font-weight="bold" font-style="normal">1. Диверсификация</text>
<text x="600.0" y="132.0" text-anchor="middle" font-size="11" fill="#000000" font-weight="normal" font-style="normal">монетизации:</text>
<text x="600.0" y="148.0" text-anchor="middle" font-size="11" fill="#000000" font-weight="normal" font-style="normal">премиум-тарифы,</text>
<text x="600.0" y="164.0" text-anchor="middle" font-size="11" fill="#000000" font-weight="normal" font-style="normal">кросс-продажи</text>
<line x1="698.9949493661167" y1="388.1801948466054" x2="859.1546353048697" y2="252.06213946819497" stroke="#888888" stroke-width="1.5"/>
<rect x="815.2691193458119" y="172.01010126776671" width="220" height="100" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="2" rx="8" ry="8"/>
<text x="925.2691193458119" y="194.01010126776671" text-anchor="middle" font-size="13" fill="#1F6FB2" font-weight="bold" font-style="normal">2. Модернизация</text>
<text x="925.2691193458119" y="214.01010126776671" text-anchor="middle" font-size="11" fill="#000000" font-weight="normal" font-style="normal">платёжного шлюза:</text>
<text x="925.2691193458119" y="230.01010126776671" text-anchor="middle" font-size="11" fill="#000000" font-weight="normal" font-style="normal">ISO 20022, in-memory,</text>
<text x="925.2691193458119" y="246.01010126776671" text-anchor="middle" font-size="11" fill="#000000" font-weight="normal" font-style="normal">антифрод-оптим.</text>
